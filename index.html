<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undercover - Secret Word Party Game</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .title { font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
        }

        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }

        .glass-light {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(71, 85, 105, 0.5);
        }

        .btn-primary {
            @apply px-6 py-3 rounded-xl font-semibold transition-all duration-300;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            @apply px-6 py-3 rounded-xl font-semibold transition-all duration-300;
            background: rgba(51, 65, 85, 0.6);
            color: #e2e8f0;
            border: 1px solid rgba(100, 116, 139, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(71, 85, 105, 0.8);
            transform: translateY(-2px);
        }

        .btn-danger {
            @apply px-4 py-2 rounded-lg font-semibold transition-all duration-300;
            background: rgba(239, 68, 68, 0.7);
            color: white;
            border: 1px solid rgba(220, 38, 38, 0.5);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.9);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        .input-field {
            @apply w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-slate-100 transition-all duration-300;
        }

        .input-field:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .card-flip {
            perspective: 1000px;
        }

        .card-flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card-flip-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-flip-front, .card-flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
        }

        .card-flip-back {
            transform: rotateY(180deg);
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
        }

        .pulse-soft {
            animation: pulse-soft 2s ease-in-out infinite;
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .slide-in {
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
        }

        .hidden { display: none !important; }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
        }

        @media (max-width: 640px) {
            .player-grid {
                grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
                gap: 8px;
            }
        }

        .role-card {
            min-height: 320px;
        }

        .timer-display {
            font-size: 3.5rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 8px;
        }

        @media (max-width: 640px) {
            .timer-display {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body class="overflow-x-hidden">
    <div id="app" class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-slate-100">

        <!-- SETUP SCREEN -->
        <div id="setupScreen" class="min-h-screen flex items-center justify-center p-4">
            <div class="w-full max-w-md slide-in">
                <div class="glass rounded-3xl p-8 md:p-10">
                    <h1 class="text-4xl md:text-5xl font-bold text-center mb-2">
                        <i class="fas fa-mask neon-glow" style="color: #10b981;"></i> UNDERCOVER
                    </h1>
                    <p class="text-center text-slate-400 mb-8 text-sm md:text-base">The Secret Word Party Game</p>

                    <!-- Players Section -->
                    <div class="mb-8">
                        <label class="block text-sm font-semibold mb-4 text-emerald-400">PLAYERS</label>
                        <div id="playersList" class="space-y-2 mb-4 max-h-48 overflow-y-auto">
                        </div>
                        <div class="flex gap-2">
                            <input id="playerInput" type="text" class="input-field flex-1 text-sm" placeholder="Player name" autocomplete="off">
                            <button id="addPlayerBtn" class="btn-primary px-4 py-3">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                        <p id="playerCount" class="text-xs text-slate-400 mt-2">0 players</p>
                    </div>

                    <!-- Configuration Section -->
                    <div class="glass-light rounded-2xl p-6 mb-8">
                        <label class="block text-sm font-semibold mb-4 text-cyan-400">GAME CONFIG</label>

                        <div class="mb-6">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm">Undercovers</span>
                                <span id="undercoversValue" class="font-bold text-emerald-400">1</span>
                            </div>
                            <input id="undercoversSlider" type="range" min="1" max="5" value="1" class="w-full">
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm">Mr. Whites</span>
                                <span id="whitesValue" class="font-bold text-rose-400">1</span>
                            </div>
                            <input id="whitesSlider" type="range" min="1" max="3" value="1" class="w-full">
                        </div>
                    </div>

                    <!-- Start Button -->
                    <button id="startBtn" class="btn-primary w-full py-4 text-lg font-bold rounded-2xl" disabled>
                        <i class="fas fa-play mr-2"></i> START GAME
                    </button>
                </div>
            </div>
        </div>

        <!-- ROLE REVEAL SCREEN -->
        <div id="roleRevealScreen" class="hidden min-h-screen flex items-center justify-center p-4">
            <div class="w-full max-w-lg slide-in">
                <div class="glass rounded-3xl p-8 md:p-10">
                    <h2 class="text-3xl font-bold text-center mb-2">Role Assignment</h2>
                    <p id="revealPlayerName" class="text-center text-emerald-400 font-semibold text-lg mb-8"></p>

                    <div class="card-flip h-96 mb-8">
                        <div class="card-flip-inner" id="cardFlipInner">
                            <div class="card-flip-front glass-light rounded-2xl h-full flex items-center justify-center">
                                <button id="tapToRevealBtn" class="text-center">
                                    <i class="fas fa-eye text-5xl mb-4 text-cyan-400"></i>
                                    <p class="text-lg font-semibold mt-4">Tap to Reveal Role</p>
                                    <p class="text-xs text-slate-400 mt-2">Keep it secret!</p>
                                </button>
                            </div>
                            <div class="card-flip-back glass rounded-2xl h-full flex items-center justify-center p-6">
                                <div class="text-center">
                                    <p id="roleLabel" class="text-sm text-slate-400 uppercase tracking-widest mb-4"></p>
                                    <p id="roleWord" class="text-5xl font-bold neon-glow text-emerald-400 break-words"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button id="confirmRevealBtn" class="btn-primary w-full py-4 rounded-2xl font-semibold">
                        <i class="fas fa-check mr-2"></i> Got It, Hide My Word
                    </button>
                </div>
            </div>
        </div>

        <!-- GAME DASHBOARD SCREEN -->
        <div id="gameDashboardScreen" class="hidden min-h-screen p-4 md:p-6">
            <div class="max-w-6xl mx-auto">
                <h2 class="text-3xl md:text-4xl font-bold mb-6 text-center">
                    <i class="fas fa-gamepad mr-2" style="color: #10b981;"></i> UNDERCOVER
                </h2>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Left: Turn Order -->
                    <div class="lg:col-span-1">
                        <div class="glass rounded-2xl p-6">
                            <h3 class="text-lg font-bold text-cyan-400 mb-4 flex items-center">
                                <i class="fas fa-list mr-2"></i> Turn Order
                            </h3>
                            <div id="turnOrderList" class="space-y-2">
                            </div>
                        </div>
                    </div>

                    <!-- Center: Timer -->
                    <div class="lg:col-span-1">
                        <div class="glass rounded-2xl p-6 flex flex-col items-center justify-center">
                            <h3 class="text-lg font-bold text-rose-400 mb-4 flex items-center justify-center w-full">
                                <i class="fas fa-hourglass-end mr-2"></i> Discussion
                            </h3>
                            <div class="timer-display text-emerald-400 neon-glow mb-6" id="timerDisplay">2:00</div>
                            <div class="flex gap-2 w-full justify-center">
                                <button id="playPauseBtn" class="btn-secondary px-6 py-2 rounded-xl">
                                    <i class="fas fa-play"></i>
                                </button>
                                <button id="resetTimerBtn" class="btn-secondary px-6 py-2 rounded-xl">
                                    <i class="fas fa-redo"></i>
                                </button>
                            </div>
                            <div class="mt-4 text-xs text-slate-400 text-center">
                                <input id="timerMinutes" type="number" min="0" max="10" value="2" class="w-12 px-2 py-1 rounded bg-slate-800 border border-slate-700 text-center">
                                <span class="mx-1">:</span>
                                <input id="timerSeconds" type="number" min="0" max="59" value="00" class="w-12 px-2 py-1 rounded bg-slate-800 border border-slate-700 text-center">
                            </div>
                        </div>
                    </div>

                    <!-- Right: Alive Players -->
                    <div class="lg:col-span-1">
                        <div class="glass rounded-2xl p-6">
                            <h3 class="text-lg font-bold text-emerald-400 mb-4 flex items-center">
                                <i class="fas fa-users mr-2"></i> Alive
                            </h3>
                            <div id="alivePlayersList" class="player-grid">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- VICTORY SCREEN -->
        <div id="victoryScreen" class="hidden min-h-screen flex items-center justify-center p-4">
            <div class="w-full max-w-2xl slide-in">
                <div class="glass rounded-3xl p-8 md:p-10">
                    <div class="text-center mb-8">
                        <i id="victoryIcon" class="fas fa-5x mb-4" style="color: #10b981;"></i>
                        <h1 id="victoryTitle" class="text-4xl md:text-5xl font-bold mb-2"></h1>
                        <p id="victorySubtitle" class="text-slate-400 text-lg"></p>
                    </div>

                    <div id="roleRevealsList" class="space-y-3 mb-8 max-h-96 overflow-y-auto">
                    </div>

                    <button id="playAgainBtn" class="btn-primary w-full py-4 text-lg font-bold rounded-2xl">
                        <i class="fas fa-redo mr-2"></i> Play Again
                    </button>
                </div>
            </div>
        </div>

        <!-- ELIMINATION CONFIRMATION MODAL -->
        <div id="eliminationModal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">
            <div class="glass rounded-2xl p-8 max-w-sm w-full slide-in">
                <h3 class="text-2xl font-bold mb-4">Eliminate Player?</h3>
                <p id="eliminationPlayerName" class="text-lg text-emerald-400 font-semibold mb-6"></p>
                <div class="flex gap-3">
                    <button id="confirmEliminateBtn" class="btn-danger flex-1 py-3 rounded-xl">
                        <i class="fas fa-check mr-1"></i> Eliminate
                    </button>
                    <button id="cancelEliminateBtn" class="btn-secondary flex-1 py-3 rounded-xl">
                        <i class="fas fa-times mr-1"></i> Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- MR WHITE GUESS MODAL -->
        <div id="whiteGuessModal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">
            <div class="glass rounded-2xl p-8 max-w-sm w-full slide-in">
                <h3 class="text-2xl font-bold mb-2">Mr. White Exposed!</h3>
                <p id="whitePlayerName" class="text-lg text-rose-400 font-semibold mb-6"></p>
                <p class="text-slate-400 mb-6">What's the Civilian word?</p>
                <input id="whiteGuessInput" type="text" class="input-field mb-4 text-center" placeholder="Your guess..." autocomplete="off">
                <div class="flex gap-3">
                    <button id="submitWhiteGuessBtn" class="btn-primary flex-1 py-3 rounded-xl">
                        <i class="fas fa-check mr-1"></i> Submit
                    </button>
                    <button id="skipWhiteGuessBtn" class="btn-secondary flex-1 py-3 rounded-xl">
                        <i class="fas fa-skip-forward mr-1"></i> Skip
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WORD_PAIRS = [
            { civilian: 'Apple', undercover: 'Pear' },
            { civilian: 'Cat', undercover: 'Dog' },
            { civilian: 'Laptop', undercover: 'Computer' },
            { civilian: 'Car', undercover: 'Motorcycle' },
            { civilian: 'Coffee', undercover: 'Tea' },
            { civilian: 'Piano', undercover: 'Guitar' },
            { civilian: 'Pizza', undercover: 'Burger' },
            { civilian: 'Beach', undercover: 'Ocean' },
            { civilian: 'Book', undercover: 'Magazine' },
            { civilian: 'Summer', undercover: 'Winter' },
            { civilian: 'Doctor', undercover: 'Nurse' },
            { civilian: 'School', undercover: 'University' },
            { civilian: 'Fish', undercover: 'Whale' },
            { civilian: 'Mountain', undercover: 'Hill' },
            { civilian: 'Rainbow', undercover: 'Sunset' },
            { civilian: 'Dance', undercover: 'Music' },
            { civilian: 'Flower', undercover: 'Tree' },
            { civilian: 'Sun', undercover: 'Moon' },
            { civilian: 'River', undercover: 'Lake' },
            { civilian: 'Bread', undercover: 'Cake' },
            { civilian: 'Train', undercover: 'Bus' },
            { civilian: 'Crown', undercover: 'Throne' },
            { civilian: 'Candle', undercover: 'Lantern' },
            { civilian: 'Prince', undercover: 'King' },
            { civilian: 'Rose', undercover: 'Lily' },
            { civilian: 'Violin', undercover: 'Harp' },
            { civilian: 'Marble', undercover: 'Granite' },
            { civilian: 'Sword', undercover: 'Spear' },
            { civilian: 'Crown', undercover: 'Tiara' },
            { civilian: 'Castle', undercover: 'Palace' },
            { civilian: 'Sword', undercover: 'Axe' },
            { civilian: 'Flame', undercover: 'Spark' },
            { civilian: 'Eagle', undercover: 'Hawk' },
            { civilian: 'Wave', undercover: 'Tide' },
            { civilian: 'Star', undercover: 'Comet' },
            { civilian: 'Jungle', undercover: 'Forest' },
            { civilian: 'Sphinx', undercover: 'Pyramid' },
            { civilian: 'Thunder', undercover: 'Lightning' },
            { civilian: 'Diamond', undercover: 'Emerald' },
            { civilian: 'Portal', undercover: 'Gateway' },
        ];

        const ROLES = {
            CIVILIAN: 'civilian',
            UNDERCOVER: 'undercover',
            WHITE: 'white'
        };

        let gameState = {
            players: [],
            currentScreen: 'setup',
            undercoversCount: 1,
            whitesCount: 1,
            gameStarted: false,
            currentRevealIndex: 0,
            alivePlayerIndices: [],
            currentTurnIndex: 0,
            turnOrder: [],
            eliminatedPlayers: new Set(),
            gameEnded: false,
            timerRunning: false,
            timerSeconds: 120,
            selectedWordPair: null,
            playerRoles: {}
        };

        const screens = {
            setup: 'setupScreen',
            roleReveal: 'roleRevealScreen',
            gameDashboard: 'gameDashboardScreen',
            victory: 'victoryScreen'
        };

        function hideAllScreens() {
            Object.values(screens).forEach(screenId => {
                document.getElementById(screenId).classList.add('hidden');
            });
        }

        function showScreen(screenName) {
            hideAllScreens();
            document.getElementById(screens[screenName]).classList.remove('hidden');
            gameState.currentScreen = screenName;
        }

        function addPlayer() {
            const input = document.getElementById('playerInput');
            const name = input.value.trim();
            if (name && gameState.players.length < 20) {
                gameState.players.push(name);
                input.value = '';
                renderPlayersList();
            }
        }

        function removePlayer(index) {
            gameState.players.splice(index, 1);
            renderPlayersList();
        }

        function renderPlayersList() {
            const list = document.getElementById('playersList');
            list.innerHTML = gameState.players.map((player, idx) => `
                <div class="flex justify-between items-center glass-light rounded-lg p-3">
                    <span class="text-sm">${player}</span>
                    <button onclick="removePlayer(${idx})" class="text-rose-400 hover:text-rose-300">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');

            const count = gameState.players.length;
            document.getElementById('playerCount').textContent = `${count} players`;
            updateStartButton();
        }

        function updateStartButton() {
            const btn = document.getElementById('startBtn');
            const minPlayers = gameState.undercoversCount + gameState.whitesCount + 1;
            const canStart = gameState.players.length >= minPlayers && gameState.players.length >= 3;
            btn.disabled = !canStart;
        }

        function startGame() {
            if (gameState.players.length < 3) return;

            gameState.alivePlayerIndices = Array.from({ length: gameState.players.length }, (_, i) => i);
            gameState.selectedWordPair = WORD_PAIRS[Math.floor(Math.random() * WORD_PAIRS.length)];

            gameState.playerRoles = {};
            const roles = [];
            for (let i = 0; i < gameState.undercoversCount; i++) roles.push(ROLES.UNDERCOVER);
            for (let i = 0; i < gameState.whitesCount; i++) roles.push(ROLES.WHITE);
            while (roles.length < gameState.players.length) roles.push(ROLES.CIVILIAN);

            for (let i = roles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [roles[i], roles[j]] = [roles[j], roles[i]];
            }

            gameState.players.forEach((player, idx) => {
                gameState.playerRoles[player] = roles[idx];
            });

            gameState.currentRevealIndex = 0;
            gameState.gameStarted = true;
            showRoleReveal();
        }

        function showRoleReveal() {
            if (gameState.currentRevealIndex >= gameState.players.length) {
                initializeGameDashboard();
                return;
            }

            const player = gameState.players[gameState.currentRevealIndex];
            document.getElementById('revealPlayerName').textContent = player;
            document.getElementById('cardFlipInner').classList.remove('flipped');
            showScreen('roleReveal');
        }

        function revealCard() {
            document.getElementById('cardFlipInner').classList.add('flipped');
            const player = gameState.players[gameState.currentRevealIndex];
            const role = gameState.playerRoles[player];

            let roleLabel = '';
            let roleWord = '';

            if (role === ROLES.CIVILIAN) {
                roleLabel = 'Civilian';
                roleWord = gameState.selectedWordPair.civilian;
            } else if (role === ROLES.UNDERCOVER) {
                roleLabel = 'Undercover';
                roleWord = gameState.selectedWordPair.undercover;
            } else {
                roleLabel = 'Mr. White';
                roleWord = '??';
            }

            document.getElementById('roleLabel').textContent = roleLabel;
            document.getElementById('roleWord').textContent = roleWord;
        }

        function nextPlayerReveal() {
            gameState.currentRevealIndex++;
            showRoleReveal();
        }

        function initializeGameDashboard() {
            const shuffledIndices = [...gameState.alivePlayerIndices].sort(() => Math.random() - 0.5);
            gameState.turnOrder = shuffledIndices;
            gameState.currentTurnIndex = 0;
            gameState.timerSeconds = 120;
            gameState.timerRunning = false;
            renderGameDashboard();
            showScreen('gameDashboard');
        }

        function renderGameDashboard() {
            renderTurnOrder();
            renderAlivePlayers();
            updateTimerDisplay();
        }

        function renderTurnOrder() {
            const list = document.getElementById('turnOrderList');
            list.innerHTML = gameState.turnOrder.map((idx, order) => {
                const player = gameState.players[idx];
                const isCurrentTurn = order === gameState.currentTurnIndex && !gameState.eliminatedPlayers.has(idx);
                return `
                    <div class="flex items-center gap-2 p-3 rounded-lg ${isCurrentTurn ? 'bg-emerald-900 border border-emerald-500' : 'glass-light'}">
                        <span class="text-xs font-bold text-slate-400 w-6">${order + 1}</span>
                        <span class="text-sm ${isCurrentTurn ? 'text-emerald-300 font-semibold' : 'text-slate-300'}">${player}</span>
                    </div>
                `;
            }).join('');
        }

        function renderAlivePlayers() {
            const list = document.getElementById('alivePlayersList');
            list.innerHTML = gameState.alivePlayerIndices.map(idx => {
                const player = gameState.players[idx];
                if (gameState.eliminatedPlayers.has(idx)) return '';

                return `
                    <button onclick="initiateElimination(${idx})" class="glass-light hover:bg-slate-700 rounded-lg p-4 text-center transition-all hover:scale-105 active:scale-95">
                        <div class="text-2xl mb-2"><i class="fas fa-user-circle text-cyan-400"></i></div>
                        <p class="text-xs font-semibold break-words">${player}</p>
                    </button>
                `;
            }).join('');
        }

        function initiateElimination(playerIdx) {
            document.getElementById('eliminationPlayerName').textContent = gameState.players[playerIdx];
            document.getElementById('confirmEliminateBtn').onclick = () => eliminatePlayer(playerIdx);
            document.getElementById('cancelEliminateBtn').onclick = () => {
                document.getElementById('eliminationModal').classList.add('hidden');
            };
            document.getElementById('eliminationModal').classList.remove('hidden');
        }

        function eliminatePlayer(playerIdx) {
            document.getElementById('eliminationModal').classList.add('hidden');
            gameState.eliminatedPlayers.add(playerIdx);
            const role = gameState.playerRoles[gameState.players[playerIdx]];

            if (role === ROLES.WHITE) {
                showWhiteGuessModal(playerIdx);
                return;
            }

            checkGameEnd();
            if (!gameState.gameEnded) {
                renderGameDashboard();
            }
        }

        function showWhiteGuessModal(playerIdx) {
            document.getElementById('whitePlayerName').textContent = gameState.players[playerIdx];
            document.getElementById('whiteGuessInput').value = '';

            document.getElementById('submitWhiteGuessBtn').onclick = () => {
                const guess = document.getElementById('whiteGuessInput').value.trim().toLowerCase();
                const correctWord = gameState.selectedWordPair.civilian.toLowerCase();
                document.getElementById('whiteGuessModal').classList.add('hidden');

                if (guess === correctWord) {
                    endGame(ROLES.WHITE);
                } else {
                    checkGameEnd();
                    if (!gameState.gameEnded) renderGameDashboard();
                }
            };

            document.getElementById('skipWhiteGuessBtn').onclick = () => {
                document.getElementById('whiteGuessModal').classList.add('hidden');
                checkGameEnd();
                if (!gameState.gameEnded) renderGameDashboard();
            };

            document.getElementById('whiteGuessModal').classList.remove('hidden');
        }

        function checkGameEnd() {
            const aliveIndices = gameState.alivePlayerIndices.filter(i => !gameState.eliminatedPlayers.has(i));
            const aliveCivilians = aliveIndices.filter(i => gameState.playerRoles[gameState.players[i]] === ROLES.CIVILIAN);
            const aliveUndercovers = aliveIndices.filter(i => gameState.playerRoles[gameState.players[i]] === ROLES.UNDERCOVER);
            const aliveWhites = aliveIndices.filter(i => gameState.playerRoles[gameState.players[i]] === ROLES.WHITE);

            if (aliveUndercovers.length === 0 && aliveWhites.length === 0) {
                endGame(ROLES.CIVILIAN);
            } else if (aliveUndercovers.length >= aliveCivilians.length) {
                endGame(ROLES.UNDERCOVER);
            } else if (aliveWhites.length === gameState.alivePlayerIndices.length - gameState.eliminatedPlayers.size) {
                endGame(ROLES.WHITE);
            }
        }

        function endGame(winningRole) {
            gameState.gameEnded = true;
            gameState.timerRunning = false;
            showVictoryScreen(winningRole);
        }

        function showVictoryScreen(winningRole) {
            let title = '';
            let subtitle = '';
            let icon = '';

            if (winningRole === ROLES.CIVILIAN) {
                title = 'Civilians Win!';
                subtitle = 'The secret word is safe!';
                icon = 'fas fa-shield-alt';
            } else if (winningRole === ROLES.UNDERCOVER) {
                title = 'Undercovers Win!';
                subtitle = 'They infiltrated successfully!';
                icon = 'fas fa-mask';
            } else {
                title = 'Mr. White Wins!';
                subtitle = 'They guessed the word!';
                icon = 'fas fa-user-secret';
            }

            document.getElementById('victoryTitle').textContent = title;
            document.getElementById('victorySubtitle').textContent = subtitle;
            document.getElementById('victoryIcon').className = `fas fa-5x ${icon}`;

            const list = document.getElementById('roleRevealsList');
            list.innerHTML = gameState.players.map(player => {
                const role = gameState.playerRoles[player];
                let roleDisplay = '';
                let roleColor = '';
                let roleWord = '';

                if (role === ROLES.CIVILIAN) {
                    roleDisplay = 'Civilian';
                    roleColor = 'text-emerald-400';
                    roleWord = gameState.selectedWordPair.civilian;
                } else if (role === ROLES.UNDERCOVER) {
                    roleDisplay = 'Undercover';
                    roleColor = 'text-cyan-400';
                    roleWord = gameState.selectedWordPair.undercover;
                } else {
                    roleDisplay = 'Mr. White';
                    roleColor = 'text-rose-400';
                    roleWord = '??';
                }

                return `
                    <div class="glass-light rounded-lg p-4 flex justify-between items-center">
                        <div>
                            <p class="font-semibold">${player}</p>
                            <p class="${roleColor} text-sm">${roleDisplay}</p>
                        </div>
                        <p class="neon-glow font-bold text-lg">${roleWord}</p>
                    </div>
                `;
            }).join('');

            showScreen('victory');
        }

        function updateTimerDisplay() {
            const mins = Math.floor(gameState.timerSeconds / 60);
            const secs = gameState.timerSeconds % 60;
            document.getElementById('timerDisplay').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            gameState.timerRunning = !gameState.timerRunning;
            const btn = document.getElementById('playPauseBtn');
            btn.innerHTML = gameState.timerRunning ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';

            if (gameState.timerRunning) {
                const timerInterval = setInterval(() => {
                    if (!gameState.timerRunning) {
                        clearInterval(timerInterval);
                        return;
                    }
                    if (gameState.timerSeconds > 0) {
                        gameState.timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        gameState.timerRunning = false;
                        btn.innerHTML = '<i class="fas fa-play"></i>';
                        clearInterval(timerInterval);
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            gameState.timerRunning = false;
            const mins = parseInt(document.getElementById('timerMinutes').value) || 2;
            const secs = parseInt(document.getElementById('timerSeconds').value) || 0;
            gameState.timerSeconds = mins * 60 + secs;
            document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-play"></i>';
            updateTimerDisplay();
        }

        function playAgain() {
            gameState = {
                players: gameState.players,
                currentScreen: 'setup',
                undercoversCount: gameState.undercoversCount,
                whitesCount: gameState.whitesCount,
                gameStarted: false,
                currentRevealIndex: 0,
                alivePlayerIndices: [],
                currentTurnIndex: 0,
                turnOrder: [],
                eliminatedPlayers: new Set(),
                gameEnded: false,
                timerRunning: false,
                timerSeconds: 120,
                selectedWordPair: null,
                playerRoles: {}
            };
            showScreen('setup');
        }

        // Event Listeners
        document.getElementById('addPlayerBtn').addEventListener('click', addPlayer);
        document.getElementById('playerInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') addPlayer();
        });

        document.getElementById('undercoversSlider').addEventListener('change', e => {
            gameState.undercoversCount = parseInt(e.target.value);
            document.getElementById('undercoversValue').textContent = gameState.undercoversCount;
            updateStartButton();
        });

        document.getElementById('whitesSlider').addEventListener('change', e => {
            gameState.whitesCount = parseInt(e.target.value);
            document.getElementById('whitesValue').textContent = gameState.whitesCount;
            updateStartButton();
        });

        document.getElementById('startBtn').addEventListener('click', startGame);

        document.getElementById('tapToRevealBtn').addEventListener('click', revealCard);
        document.getElementById('confirmRevealBtn').addEventListener('click', nextPlayerReveal);

        document.getElementById('playPauseBtn').addEventListener('click', toggleTimer);
        document.getElementById('resetTimerBtn').addEventListener('click', resetTimer);

        document.getElementById('playAgainBtn').addEventListener('click', playAgain);

        showScreen('setup');
    </script>
</body>
</html>
